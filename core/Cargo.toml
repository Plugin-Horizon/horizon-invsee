[package]
name = "horizon-invsee"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-only"
publish = false
description = "invsee for Horizon: sessions, click rules, templates, name lookup and change log (no Horizon types)"

# Only crates that Horizon's Cargo.lock already holds (docs/native-mods.md, "The mod's crate").
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
