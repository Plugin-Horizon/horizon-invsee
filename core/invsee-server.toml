# invsee: view and edit other players' inventories and ender chests, online or offline.
# The game reloads this file by itself when it changes; /invseeplusplusreload (or /isppreload) reads it at once.

[access]
# The operator level (0 to 4, ops.json) each action needs. Players below the lowest view level
# do not see the commands at all. Edit implies view. The defaults are InvSee++'s `default: op`
# (level 1 = any operator). Each level is one number: InvSee++'s permission nodes map to these.
invsee_view = 1
invsee_edit = 1
endersee_view = 1
endersee_edit = 1
reload = 1
# Who may open the inventories of exempt players: a level, 5 = nobody (InvSee++'s bypass-exempt
# nodes default to false).
bypass_exempt = 5
# Names or UUIDs whose inventory / ender chest only players of `bypass_exempt` may open.
exempt_invsee = []
exempt_endersee = []

[players]
# Open the inventories of players who are not on the server (from their player file).
offline = true
# Accept players who never played here (an empty view, nothing can be stored yet).
unknown = true
# Complete the names of offline players in /invsee and /endersee.
tabcomplete_offline = true
# How a typed name becomes a UUID, tried in this order:
#   online      a player on the server
#   logged_out  a player who left since the server started
#   usercache   the server's usercache.json
#   mojang      Mojang's profile API (a request on a thread of its own)
#   offline     the offline-mode UUID of the name (UUID v3 of "OfflinePlayer:<name>")
uuid_resolve = ["online", "logged_out", "usercache", "mojang"]
# How a typed UUID gets a name for the title: online, logged_out, usercache, mojang.
name_resolve = ["online", "logged_out", "usercache", "mojang"]
# How long a Mojang request may take, in milliseconds.
mojang_timeout_ms = 5000
# How often an open view of an offline player is read again from the file, in ticks.
# Views of online players follow every tick.
offline_refresh_ticks = 20

[titles]
inventory = "<player>'s inventory"
enderchest = "<player>'s enderchest"

# The layout of the views, one line per row (up to six rows of nine).
#   inventory:  i_00..i_35 the inventory (i_00..i_08 the hotbar); a_b a_l a_c a_h boots, leggings,
#               chestplate, helmet; oh the off hand; b body, s saddle, c cursor, p_00..p_08 the
#               crafting grid (shown as unavailable on Horizon); _ an unused slot
#   enderchest: e_00..e_26 (rows past the 27 slots are left out)
[templates]
inventory = """
i_00 i_01 i_02 i_03 i_04 i_05 i_06 i_07 i_08
i_09 i_10 i_11 i_12 i_13 i_14 i_15 i_16 i_17
i_18 i_19 i_20 i_21 i_22 i_23 i_24 i_25 i_26
i_27 i_28 i_29 i_30 i_31 i_32 i_33 i_34 i_35
a_b  a_l  a_c  a_h  oh   b    s    c    _
p_00 p_01 p_02 p_03 p_04 p_05 p_06 p_07 p_08
"""
enderchest = """
e_00 e_01 e_02 e_03 e_04 e_05 e_06 e_07 e_08
e_09 e_10 e_11 e_12 e_13 e_14 e_15 e_16 e_17
e_18 e_19 e_20 e_21 e_22 e_23 e_24 e_25 e_26
e_27 e_28 e_29 e_30 e_31 e_32 e_33 e_34 e_35
e_36 e_37 e_38 e_39 e_40 e_41 e_42 e_43 e_44
e_45 e_46 e_47 e_48 e_49 e_50 e_51 e_52 e_53
"""

[menu]
# What stands in empty armour and unavailable slots: "glass panes", "icons" or "empty".
placeholder_palette = "glass panes"

[logging]
# LOG_NEVER, LOG_ON_CLOSE (one entry when the view closes) or LOG_EVERY_CHANGE.
granularity = "LOG_ON_CLOSE"
# Zero or more of SERVER_LOG_FILE, PLUGIN_LOG_FILE (<world>/invsee/InvSee++ logs/_global.log),
# SPECTATOR_LOG_FILE (<world>/invsee/InvSee++ logs/<spectator uuid>.log) and CONSOLE.
output = ["PLUGIN_LOG_FILE"]
# Macros: <date> <time> <level> <spectator_uuid> <spectator_name> <taken> <given> <target>
format_server_log_file = """

Spectator UUID: <spectator_uuid>
Spectator Name: <spectator_name>
Taken         : <taken>
Given         : <given>
Target        : <target>"""
format_plugin_log_file = """[<date> <time>] [<level>]:
Spectator UUID: <spectator_uuid>
Spectator Name: <spectator_name>
Taken         : <taken>
Given         : <given>
Target        : <target>"""
format_spectator_log_file = """[<date> <time>] [<level>]:
Taken         : <taken>
Given         : <given>
Target        : <target>"""
format_console = """[<date> <time>] [<level>]:
Spectator UUID: <spectator_uuid>
Spectator Name: <spectator_name>
Taken         : <taken>
Given         : <given>
Target        : <target>"""
