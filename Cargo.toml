[package]
name = "mod-invsee"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# The unchanged logic crate (core/). Its own dependencies (serde, toml, chrono, ureq) are the ones
# Horizon's Cargo.lock already holds.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

